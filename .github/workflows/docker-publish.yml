name: Build and Push Docker Images

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/techdebt-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/techdebt-frontend

jobs:
  build:
    name: Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (export)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: techdebt-backend:ci
          outputs: type=docker,dest=/tmp/techdebt-backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (export)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: techdebt-frontend:ci
          outputs: type=docker,dest=/tmp/techdebt-frontend.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            /tmp/techdebt-backend.tar
            /tmp/techdebt-frontend.tar
          retention-days: 1

  push:
    name: Image Push (Commit ID)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load backend image
        run: docker load --input /tmp/techdebt-backend.tar

      - name: Load frontend image
        run: docker load --input /tmp/techdebt-frontend.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set commit image tag
        id: vars
        shell: bash
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tag and push backend image (latest commit ID)
        shell: bash
        env:
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
        run: |
          set -euo pipefail
          image_tag="${BACKEND_IMAGE}:${SHA_TAG}"
          echo "Tagging and pushing ${image_tag}"
          docker tag techdebt-backend:ci "${image_tag}"
          docker push "${image_tag}"

      - name: Tag and push frontend image (latest commit ID)
        shell: bash
        env:
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
        run: |
          set -euo pipefail
          image_tag="${FRONTEND_IMAGE}:${SHA_TAG}"
          echo "Tagging and pushing ${image_tag}"
          docker tag techdebt-frontend:ci "${image_tag}"
          docker push "${image_tag}"

  update-deploy:
    name: Update Deploy Manifests
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update deployment manifests with commit image tag
        shell: bash
        env:
          SHA_TAG: ${{ needs.push.outputs.sha_tag }}
        run: |
          set -euo pipefail
          # Helm values (app image tags)
          sed -i -E '/^[[:space:]]*repository:[[:space:]]*vivek512\/techdebt-backend/{n;s/^([[:space:]]*tag:[[:space:]]*).*/\1'"${SHA_TAG}"'/;}' deploy/helm/techdebt/values.yaml
          sed -i -E '/^[[:space:]]*repository:[[:space:]]*vivek512\/techdebt-frontend/{n;s/^([[:space:]]*tag:[[:space:]]*).*/\1'"${SHA_TAG}"'/;}' deploy/helm/techdebt/values.yaml
          # Raw k8s deployment manifests (image tags)
          sed -i -E 's|(image:[[:space:]]*vivek512/techdebt-backend:)[^[:space:]]+|\1'"${SHA_TAG}"'|g' deploy/k8s/deployment/backend.yaml deploy/k8s/deployment/worker.yaml
          sed -i -E 's|(image:[[:space:]]*vivek512/techdebt-frontend:)[^[:space:]]+|\1'"${SHA_TAG}"'|g' deploy/k8s/deployment/frontend.yaml
          # Service manifests don't contain image tags; they are updated via Helm values only

      - name: Commit and push deployment tag update
        shell: bash
        env:
          SHA_TAG: ${{ needs.push.outputs.sha_tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/helm/techdebt/values.yaml deploy/k8s/deployment/backend.yaml deploy/k8s/deployment/worker.yaml deploy/k8s/deployment/frontend.yaml; then
            echo "No deployment tag changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/techdebt/values.yaml deploy/k8s/deployment/backend.yaml deploy/k8s/deployment/worker.yaml deploy/k8s/deployment/frontend.yaml
          git commit -m "chore(deploy): update image tags to ${SHA_TAG} [skip ci]"
          git push