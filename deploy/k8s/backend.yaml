apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: techdebt
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: techdebt-platform
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: techdebt
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: techdebt-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: techdebt-platform
    spec:
      containers:
        - name: backend
          image: techdebt-backend:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: techdebt-config
            - secretRef:
                name: techdebt-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

