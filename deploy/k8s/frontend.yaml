apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: techdebt
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: techdebt-platform
spec:
  type: NodePort
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      nodePort: 30173
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: techdebt
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: techdebt-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: techdebt-platform
    spec:
      containers:
        - name: frontend
          image: vivek512/techdebt-frontend:sha-dea9bcc
          imagePullPolicy: Always
          command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              value: "/api/v1"
            - name: VITE_PROXY_TARGET
              value: "http://backend:8000"
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 20

