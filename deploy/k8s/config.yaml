apiVersion: v1
kind: ConfigMap
metadata:
  name: techdebt-config
  namespace: techdebt
data:
  APP_NAME: "TechDebt Management Platform"
  ENVIRONMENT: "development"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql+psycopg://techdebt:techdebt@postgres:5432/techdebt"
  REDIS_URL: "redis://redis:6379/0"
  ENDOFLIFE_API_BASE: "https://endoflife.date/api/v1"
  VITE_API_BASE_URL: "/api/v1"
  VITE_PROXY_TARGET: "http://backend:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: techdebt-secrets
  namespace: techdebt
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production-secret"
  POSTGRES_DB: "techdebt"
  POSTGRES_USER: "techdebt"
  POSTGRES_PASSWORD: "techdebt"
