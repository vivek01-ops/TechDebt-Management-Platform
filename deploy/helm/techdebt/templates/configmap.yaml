apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "techdebt.fullname" . }}-config
  labels:
    {{- include "techdebt.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DATABASE_URL: {{ include "techdebt.databaseUrl" . | quote }}
  REDIS_URL: {{ include "techdebt.redisUrl" . | quote }}
  ENDOFLIFE_API_BASE: {{ .Values.config.endoflifeApiBase | quote }}
  LIFECYCLE_SYNC_HOURS: {{ .Values.config.lifecycleSyncHours | quote }}
  INVENTORY_SCAN_HOURS: {{ .Values.config.inventoryScanHours | quote }}
  LIFECYCLE_RECALC_HOURS: {{ .Values.config.lifecycleRecalcHours | quote }}
  VITE_API_BASE_URL: {{ .Values.frontend.apiBaseUrl | quote }}
  VITE_PROXY_TARGET: {{ printf "http://%s:%v" (include "techdebt.backendServiceName" .) .Values.backend.service.port | quote }}
