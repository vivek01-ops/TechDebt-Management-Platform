apiVersion: v1
kind: Secret
metadata:
  name: {{ include "techdebt.fullname" . }}-secrets
  labels:
    {{- include "techdebt.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  {{- if .Values.secrets.awsProfile }}
  AWS_PROFILE: {{ .Values.secrets.awsProfile | quote }}
  {{- end }}
  {{- if .Values.secrets.awsRegion }}
  AWS_REGION: {{ .Values.secrets.awsRegion | quote }}
  {{- end }}
  {{- if .Values.secrets.awsAssumeRoleArn }}
  AWS_ASSUME_ROLE_ARN: {{ .Values.secrets.awsAssumeRoleArn | quote }}
  {{- end }}
  {{- if .Values.secrets.awsExternalId }}
  AWS_EXTERNAL_ID: {{ .Values.secrets.awsExternalId | quote }}
  {{- end }}
