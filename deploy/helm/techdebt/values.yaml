nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

config:
  appName: "TechDebt Management Platform"
  environment: "development"
  logLevel: "INFO"
  endoflifeApiBase: "https://endoflife.date/api/v1"
  lifecycleSyncHours: "12"
  inventoryScanHours: "24"
  lifecycleRecalcHours: "24"

secrets:
  secretKey: "change-me-in-production-secret"
  # Optional AWS defaults (leave empty for portal login with access/secret keys)
  awsProfile: ""
  awsRegion: ""
  awsAssumeRoleArn: ""
  awsExternalId: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: techdebt
    username: techdebt
    password: techdebt
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources: {}

backend:
  replicaCount: 1
  image:
    repository: techdebt-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  env: {}
  resources: {}
  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 20

worker:
  replicaCount: 1
  image:
    repository: techdebt-backend
    tag: latest
    pullPolicy: IfNotPresent
  command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
  env: {}
  resources: {}

frontend:
  replicaCount: 1
  image:
    repository: techdebt-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 5173
    nodePort: 30173
  command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
  apiBaseUrl: "/api/v1"
  env: {}
  resources: {}
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 20

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: techdebt.local
  tls: []
